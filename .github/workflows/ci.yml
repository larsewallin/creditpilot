name: CI

# Checks on every PR to main (and unit tests on every push to main).
# Production is never changed here: the migration dry run always rolls back.
# Shipping happens only through the manual Deploy workflow (deploy.yml).
#
# The repo is public. Jobs that need production secrets read REPOSITORY-level
# secrets (the `production` environment only serves the main branch, so it
# cannot be used on PR branches). Fork PRs get no secrets and skip those jobs.
# Never switch these triggers to pull_request_target.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Golden onboarding harness (14/14)
        run: node tests/onboarding/run.mjs
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build
        run: npm run build

  page-check:
    name: Page check
    runs-on: ubuntu-latest
    # Builds this PR's app against the live public demo (read only) and opens every page as the
    # demo credit manager (scripts/page-check.mjs). Costs nothing: the browser blocks the
    # assistant and the demo reset. Needs no secret: the demo key is the public one.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build against the live demo
        run: |
          export VITE_SUPABASE_URL=https://yxqudytimmxufypothis.supabase.co
          export VITE_SUPABASE_PUBLISHABLE_KEY="$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' scripts/onboarding-smoke.mjs | head -1)"
          export VITE_DEMO_MODE=true
          npm run build
      - name: Install the browser
        run: npm i --no-save playwright@1.65.1 && npx playwright install --with-deps chromium
      - name: Open every page
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:4173 && break; sleep 1; done
          node scripts/page-check.mjs http://127.0.0.1:4173

  deno-check:
    name: Edge functions (Deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every edge function
        run: |
          fail=0
          for f in supabase/functions/*/index.ts; do
            case "$f" in supabase/functions/_shared/*) continue ;; esac
            echo "::group::$f"
            deno check --quiet "$f" || { echo "::error file=$f::deno check failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  cia-harness:
    name: CIA harness
    runs-on: ubuntu-latest
    # Runs against the functions deployed on production (no staging since
    # 2026-10-13), so on a PR it proves production is healthy before merge;
    # the Deploy workflow runs it again after the PR's functions are live.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Each harness run spends real API money (founder, 2026-11-19): only a PR that can change
      # how the assistant answers runs it (the assistant, shared code, the CIA tests).
      - name: Does this PR touch the assistant?
        id: paths
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(supabase/functions/(cia-agent|_shared)/|tests/cia/|supabase/migrations/)'; then
            echo "cia=yes" >> "$GITHUB_OUTPUT"
          else
            echo "cia=no" >> "$GITHUB_OUTPUT"; echo "::notice::No assistant changes: CIA harness skipped (saves API cost)."
          fi
      - uses: actions/setup-node@v4
        if: steps.paths.outputs.cia == 'yes'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.paths.outputs.cia == 'yes'
      - name: Check target is production
        if: steps.paths.outputs.cia == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          [[ "$SUPABASE_URL" == *yxqudytimmxufypothis* ]] || { echo "SUPABASE_URL secret is missing or not production"; exit 1; }
      - run: node tests/cia/run.mjs
        if: steps.paths.outputs.cia == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CIA_INTERNAL_TEST_SECRET: ${{ secrets.CIA_INTERNAL_TEST_SECRET }}

  migration-dry-run:
    name: Migration dry run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find migrations not yet on production
        id: plan
        run: |
          git fetch --tags --force origin
          # Same baseline as deploy.yml, used until the first Deploy run creates the tag.
          BASE=prod-migrated
          git rev-parse -q --verify "refs/tags/$BASE" >/dev/null || BASE=309fcca37e08d51a5fa2b463db892f4385e85b0a
          node scripts/changed-since.mjs "$BASE" HEAD > plan.json
          cat plan.json
          FILES=$(node -e 'console.log(require("./plan.json").migrations.join(" "))')
          EDITED=$(node -e 'console.log(require("./plan.json").editedMigrations.join(" "))')
          if [ -n "$EDITED" ]; then
            echo "::warning::Edited existing migration(s): $EDITED. An applied migration is never re-run; add a new file instead."
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - name: Install Postgres 17 client
        if: steps.plan.outputs.files != ''
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Dry run against production (rolled back)
        if: steps.plan.outputs.files != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FILES: ${{ steps.plan.outputs.files }}
        run: |
          [[ "$DATABASE_URL" == *yxqudytimmxufypothis* ]] || { echo "DATABASE_URL secret is missing or not production"; exit 1; }
          read -ra F <<< "$FILES"
          scripts/migrate.sh "${F[@]}"
      - name: No migrations
        if: steps.plan.outputs.files == ''
        run: echo "No new migrations in this PR."
