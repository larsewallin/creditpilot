name: Connect scheduler

# Gives the agent scheduler a fresh secret that no person sees: sets SCHEDULER_SECRET
# (Supabase function secret) and scheduler_secret (Vault, read by the pg_cron job),
# then checks agent-scheduler accepts it with a dry run. Runs when
# ops/connect-scheduler.txt changes on main, or by hand: Actions → Connect scheduler
# → Run workflow. Running it again rotates the secret.

on:
  push:
    branches: [main]
    paths: [ops/connect-scheduler.txt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-scheduler
  cancel-in-progress: false

jobs:
  connect:
    name: Connect scheduler
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Install Postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Connect
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: scripts/connect-scheduler.sh
