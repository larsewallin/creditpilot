name: AI spend

# Every morning after the demo refresh: what the assistant cost yesterday and this month, read-only.
# Visitor answers are saved with their estimated cost (cia_answers.answer.usage.est_cost_usd); the
# test runs are not saved, so they are counted from CI: only runs whose questions actually ran
# (a harness run about $0.10: 9 demo answers on the small model, about 1 cent each; an eval run about $2.50). Fails, so GitHub emails the owner, when yesterday passed $5 or the month passed $40
# (founder 2026-11-22: "if you think we are going to spend a lot of money let me know").
# The Anthropic Console's usage page is the exact figure; this is the early warning.

on:
  schedule:
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  spend:
    name: AI spend
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      DAY_LIMIT_USD: "5"
      MONTH_LIMIT_USD: "40"
    steps:
      - name: Postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Add it up
        run: |
          [[ "$DATABASE_URL" == *yxqudytimmxufypothis* ]] || { echo "::error::DATABASE_URL missing or not production"; exit 1; }
          q() { psql "$DATABASE_URL" -tAc "set default_transaction_read_only = on; $1" | tail -1; }
          COST="coalesce(sum((answer->'usage'->>'est_cost_usd')::numeric), 0)"
          DAY_ANSWERS="$(q "select count(*) from cia_answers where created_at >= now() - interval '24 hours'")"
          DAY_USD="$(q "select round($COST, 2) from cia_answers where created_at >= now() - interval '24 hours'")"
          MONTH_ANSWERS="$(q "select count(*) from cia_answers where created_at >= date_trunc('month', now())")"
          MONTH_USD="$(q "select round($COST, 2) from cia_answers where created_at >= date_trunc('month', now())")"
          MONTH_START="$(date -u +%Y-%m-01)"
          TEST_RUNS=0
          EVAL_RUNS=0
          for wf in ci.yml deploy.yml cia-eval.yml; do
            for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --created ">=$MONTH_START" --limit 300 --json databaseId --jq '.[].databaseId'); do
              steps="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name | test("CIA harness|eval"; "i")) | .steps[] | select((.name | test("tests/cia")) and (.conclusion == "success" or .conclusion == "failure")) | .name]')"
              TEST_RUNS=$((TEST_RUNS + $(echo "$steps" | jq '[.[] | select(test("eval.mjs") | not)] | length')))
              EVAL_RUNS=$((EVAL_RUNS + $(echo "$steps" | jq '[.[] | select(test("eval.mjs"))] | length')))
            done
          done
          # A harness run is ~9 answers (~$0.10); an eval run ~63 questions plus up to 120 follow-ups (~$2.50).
          TEST_USD="$(echo "$TEST_RUNS * 0.10 + $EVAL_RUNS * 2.50" | bc)"
          TOTAL="$(echo "$MONTH_USD + $TEST_USD" | bc)"
          {
            echo "### AI spend (estimated)"
            echo "| | Answers | Cost |"
            echo "| --- | --- | --- |"
            echo "| Last 24 hours, visitors | $DAY_ANSWERS | \$$DAY_USD |"
            echo "| This month, visitors | $MONTH_ANSWERS | \$$MONTH_USD |"
            echo "| This month, test runs | $TEST_RUNS harness + $EVAL_RUNS eval runs | about \$$TEST_USD |"
            echo "| **This month, total** | | **about \$$TOTAL** |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          fail=0
          if (( $(echo "$DAY_USD > $DAY_LIMIT_USD" | bc) )); then echo "::error::Visitor answers cost \$$DAY_USD in 24 hours (limit \$$DAY_LIMIT_USD)"; fail=1; fi
          if (( $(echo "$TOTAL > $MONTH_LIMIT_USD" | bc) )); then echo "::error::About \$$TOTAL this month (limit \$$MONTH_LIMIT_USD)"; fail=1; fi
          exit $fail
