project_id = "yxqudytimmxufypothis"

# The demo data is loaded by scripts/setup-local.sh (psql), not by `supabase start`: the
# dump's pg_dump 18 \restrict lines are not SQL. A production install loads no demo data.
[db.seed]
enabled = false

[functions.ar-aging-agent]
verify_jwt = false

[functions.news-monitor-agent]
verify_jwt = false

[functions.sec-monitor-agent]
verify_jwt = false

# Called by the daily scheduler (pg_cron) with x-sync-secret, or by a signed-in admin; auth is checked in code.
[functions.sanctions-sync]
verify_jwt = false

# Stand-in for the Keen scoring API; authenticated in code with KEEN_API_KEY.
[functions.keen-mock]
verify_jwt = false

# Called every 15 minutes by pg_cron with x-scheduler-secret, or by a signed-in admin for a dry run; auth is checked in code.
[functions.agent-scheduler]
verify_jwt = false
